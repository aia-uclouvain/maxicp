{% block footer %}

{# ── Fork-me-on-GitHub ribbon ──────────────────────────────────────────── #}
<div class="forkme-ribbon-wrap">
  <a href="https://github.com/aia-uclouvain/maxicp"
     target="_blank" rel="noopener noreferrer"
     aria-label="Fork me on GitHub">Fork me on GitHub</a>
</div>

<div class="footer">
    <script type="text/javascript">
  (function() {
    var ga = document.createElement('script');
    ga.src = ('https:' == document.location.protocol ?
              'https://ssl' : 'http://www') + '.google-analytics.com/ga.js';
    ga.setAttribute('async', 'true');
    document.documentElement.firstChild.appendChild(ga);
  })();
</script>
</div>

<script>
//open external links in a new window
function external_new_window() {
    for(var c = document.getElementsByTagName("a"), a = 0;a < c.length;a++) {
        var b = c[a];
        if(b.getAttribute("href") && b.hostname !== location.hostname) {
            b.target = "_blank";
            b.rel = "noopener";
        }
    }
}
//open PDF links in a new window
function pdf_new_window ()
{
    if (!document.getElementsByTagName) return false;
    var links = document.getElementsByTagName("a");
    for (var eleLink=0; eleLink < links.length; eleLink ++) {
    if ((links[eleLink].href.indexOf('.pdf') !== -1)||(links[eleLink].href.indexOf('.doc') !== -1)||(links[eleLink].href.indexOf('.docx') !== -1)) {
        links[eleLink].onclick =
        function() {
            window.open(this.href);
            return false;
        }
    }
    }
}
// Mobile sidebar toggle button for smartphone readability
function setup_mobile_nav() {
    var topNav = document.querySelector("div.related ul");
    var sidebar = document.querySelector("div.sphinxsidebar");
    if (!topNav || !sidebar) return;
    var toggleLi = document.createElement("li");
    toggleLi.className = "mobile-nav-toggle";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("aria-label", "Toggle navigation menu");
    btn.setAttribute("aria-expanded", "false");
    btn.innerHTML = "&#9776; Menu";
    btn.onclick = function() {
        var isOpen = sidebar.classList.toggle("mobile-open");
        btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
    };
    toggleLi.appendChild(btn);
    topNav.insertBefore(toggleLi, topNav.firstChild);
}
pdf_new_window();
external_new_window();
setup_mobile_nav();
</script>

{% endblock %}
